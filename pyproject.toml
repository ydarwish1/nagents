[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nagents"
version = "0.2.0"
description = "Do more agents actually help? Measured."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yusif Darwish" }]
dependencies = []

[project.optional-dependencies]
api = ["anthropic>=1.0"]

[project.scripts]
nagents = "nagents.cli:main"

[tool.setuptools.packages.find]
include = ["nagents*"]
