<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="640" height="420" fill="#ffffff"/>
<text x="64" y="22" font-size="15" font-weight="600" fill="#1f2328">Does adding agents help?</text>
<text x="64" y="39" font-size="11.5" fill="#6b7280">model subagents:sonnet,no-tools,10-per-batch · topology independent · 10 trials per size</text>
<line x1="64" x2="616" y1="342.0" y2="342.0" stroke="#e5e7eb"/>
<text x="56" y="346.0" font-size="11" fill="#6b7280" text-anchor="end">0%</text>
<line x1="64" x2="616" y1="268.5" y2="268.5" stroke="#e5e7eb"/>
<text x="56" y="272.5" font-size="11" fill="#6b7280" text-anchor="end">25%</text>
<line x1="64" x2="616" y1="195.0" y2="195.0" stroke="#e5e7eb"/>
<text x="56" y="199.0" font-size="11" fill="#6b7280" text-anchor="end">50%</text>
<line x1="64" x2="616" y1="121.5" y2="121.5" stroke="#e5e7eb"/>
<text x="56" y="125.5" font-size="11" fill="#6b7280" text-anchor="end">75%</text>
<line x1="64" x2="616" y1="48.0" y2="48.0" stroke="#e5e7eb"/>
<text x="56" y="52.0" font-size="11" fill="#6b7280" text-anchor="end">100%</text>
<text x="16" y="195" font-size="11.5" fill="#6b7280" transform="rotate(-90 16 195)" text-anchor="middle">accuracy</text>
<text x="80.0" y="360" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
<text x="340.0" y="360" font-size="11" fill="#6b7280" text-anchor="middle">3</text>
<text x="600.0" y="360" font-size="11" fill="#6b7280" text-anchor="middle">5</text>
<text x="340" y="376" font-size="11.5" fill="#6b7280" text-anchor="middle">agents in the group</text>
<polygon points="80.0,48.0 340.0,48.0 600.0,48.0 600.0,48.0 340.0,136.2 80.0,195.0" fill="#bfdbfe" opacity="0.7"/>
<polyline points="80.0,83.3 340.0,56.0 600.0,48.2" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/>
<polyline points="80.0,106.8 340.0,48.0 600.0,48.0" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 4"/>
<polyline points="80.0,83.3 340.0,59.8 600.0,48.0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="80.0,106.8 340.0,77.4 600.0,48.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="80.0" cy="106.8" r="4" fill="#2563eb"/>
<circle cx="340.0" cy="77.4" r="4" fill="#2563eb"/>
<circle cx="600.0" cy="48.0" r="4" fill="#2563eb"/>
<line x1="64" x2="86" y1="390" y2="390" stroke="#2563eb" stroke-width="2.5"/>
<text x="92" y="394" font-size="11.5" fill="#1f2328">measured (95% CI)</text>
<line x1="212.8" x2="234.8" y1="390" y2="390" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="240.8" y="394" font-size="11.5" fill="#1f2328">if mistakes were independent</text>
<line x1="432.0" x2="454.0" y1="390" y2="390" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="2 4"/>
<text x="460.0" y="394" font-size="11.5" fill="#1f2328">someone was right</text>
<line x1="64" x2="86" y1="408" y2="408" stroke="#f59e0b" stroke-width="2.5"/>
<text x="92" y="412" font-size="11.5" fill="#1f2328">every seat counted equally</text>
</svg>