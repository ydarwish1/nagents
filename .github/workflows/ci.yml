name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline, no deps)
        run: python -m unittest discover -s tests -t . -v
      - name: End-to-end mock grid
        run: python -m nagents run --mock --suite chain --depth 6 --trials 12 --sizes 1,3,5 --seed 7 --out /tmp/ci-demo
